[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sak-telemetry"
version = "0.1.0"
description = "Explainable early warning for satellite telemetry anomalies"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - research prototype" }
authors = [{ name = "SAK Project Team" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "matplotlib>=3.8",
    "plotly>=5.19",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.10"]
xai = ["captum>=0.7", "shap>=0.45"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pandas-stubs>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sak"]

