project:
  seed: 42

synthetic:
  periods: 20160
  frequency: 1min
  start: 2026-01-01T00:00:00Z
  orbit_period_steps: 96
  missing_fraction: 0.001
  benign_events_per_partition: 2

split:
  strategy: train_calibration_validation_test
  train_fraction: 0.50
  calibration_fraction: 0.20
  validation_fraction: 0.10

synthetic_anomaly_schedule:
  calibration_events:
    enabled: true
    count_per_type: 1
    severity_levels:
      - medium
  validation_events:
    enabled: true
    count_per_type: 1
    severity_levels:
      - low
      - medium
  test_events:
    enabled: true
    count_per_type: 2
    severity_levels:
      - low
      - medium
      - high

preprocessing:
  max_forward_fill_steps: 5

pca:
  explained_variance: 0.95

autoencoder:
  hidden_dim: 24
  latent_dim: 6
  epochs: 35
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 6

temporal_autoencoder:
  window_size: 60
  stride: 1
  label_mode: any
  hidden_channels: 32
  latent_channels: 16
  kernel_size: 5
  num_layers: 3
  dropout: 0.0
  epochs: 35
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 6
  aggregation: mean

early_warning:
  ewma_alpha: 0.20
  threshold_quantile: 0.995
  mode_context_column: operational_mode
  mode_minimum_samples: 10
  threshold_sweep_quantiles:
    - 0.99
    - 0.995
    - 0.999
  minimum_hits: 3
  lookback_steps: 5
  merge_gap_steps: 10

threshold_selection:
  strategy: quantile
  candidate_quantiles:
    - 0.950
    - 0.975
    - 0.980
    - 0.985
    - 0.990
    - 0.992
    - 0.995
    - 0.997
    - 0.999
    - 0.9995
  minimum_event_recall: 0.90
  maximum_false_alarms_per_day: 0.50
  tie_breaker: lower_delay

operating_point_selection:
  enabled: true
  selection_partition: calibration
  sanity_partition: validation
  minimum_event_recall: 0.90
  minimum_critical_recall: 0.90
  minimum_before_critical_rate: 0.80
  maximum_false_alarms_per_day: 0.75
  prefer_lower_delay: true
  prefer_higher_lead_time: true
  fallback: highest_recall

temporal_calibration:
  enabled: true
  score_transform: none
  aggregation: mean
  suppress_uncovered_edges: true
  edge_trim_steps: 0

alarm_filter_sweep:
  enabled: true
  ewma_alpha:
    - 0.10
    - 0.20
    - 0.30
  minimum_hits:
    - 2
    - 3
    - 4
    - 5
  lookback_steps:
    - 5
    - 7
  merge_gap_steps:
    - 10

temporal_ablation:
  enabled: false
  window_size:
    - 30
    - 60
    - 120
  stride:
    - 1
    - 5
  latent_channels:
    - 4
    - 8
    - 16
  hidden_channels:
    - 16
    - 32
  kernel_size:
    - 3
    - 5
  num_layers:
    - 2
    - 3

dashboard:
  default_variants:
    - pca_global
    - dense_autoencoder_global
    - tcn_autoencoder_global
  hide_legacy_by_default: true
  show_mode_aware: advanced
  show_fixed_quantile: advanced
  show_ablation: advanced
  max_event_cards: 20
  sort_models_by: operational_score

explainability:
  top_k_channels: 5
  subsystem_mapping: configs/subsystems.yaml
